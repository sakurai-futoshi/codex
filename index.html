<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI勉強会のお知らせ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        color-scheme: light;
        font-family: "Noto Sans JP", system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        --surface: #f8f9fb;
        --surface-muted: #ffffff;
        --accent: #5271ff;
        --accent-soft: rgba(82, 113, 255, 0.08);
        --text-strong: #19213d;
        --text-subtle: #5c637a;
        --shadow-soft: 0 24px 48px rgba(18, 35, 80, 0.14);
        background-color: var(--surface);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        color: var(--text-strong);
        background: radial-gradient(circle at top left, #e6ecff, var(--surface));
        min-height: 100vh;
      }

      .page {
        display: grid;
        gap: 32px;
        max-width: 960px;
        margin: 0 auto 96px;
        padding: 48px 24px 72px;
      }

      header {
        position: relative;
        border-radius: 32px;
        overflow: hidden;
        min-height: 320px;
        background: linear-gradient(
            rgba(8, 19, 54, 0.4),
            rgba(8, 19, 54, 0.55)
          ),
          url("https://images.unsplash.com/photo-1520607162513-77705c0f0d4a?auto=format&fit=crop&w=1600&q=80")
            center/cover;
        box-shadow: var(--shadow-soft);
        display: flex;
        align-items: flex-end;
        padding: 48px;
      }

      header::before {
        content: "";
        position: absolute;
        inset: 0;
        background: linear-gradient(
          135deg,
          rgba(255, 255, 255, 0.08) 0%,
          rgba(82, 113, 255, 0.18) 100%
        );
        mix-blend-mode: screen;
        opacity: 0.8;
        pointer-events: none;
      }

      header h1 {
        position: relative;
        margin: 0;
        font-size: clamp(2.4rem, 5vw, 3.6rem);
        line-height: 1.15;
        color: #fff;
        max-width: 18ch;
        text-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
      }

      main {
        background: var(--surface-muted);
        border-radius: 28px;
        padding: 40px;
        box-shadow: var(--shadow-soft);
      }

      main h2 {
        margin: 0 0 24px;
        font-weight: 700;
        font-size: 1.8rem;
      }

      .details {
        display: grid;
        gap: 20px;
      }

      .detail-card {
        display: flex;
        gap: 16px;
        padding: 20px;
        border-radius: 18px;
        background: var(--accent-soft);
        align-items: center;
        transition: transform 200ms ease, box-shadow 200ms ease;
      }

      .detail-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 18px 40px rgba(82, 113, 255, 0.18);
      }

      .icon {
        width: 52px;
        height: 52px;
        border-radius: 16px;
        display: grid;
        place-items: center;
        background: var(--surface-muted);
        color: var(--accent);
        font-size: 1.6rem;
        font-weight: 700;
        box-shadow: 0 8px 24px rgba(17, 34, 68, 0.08);
      }

      .detail-content {
        display: grid;
        gap: 4px;
      }

      .label {
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--text-subtle);
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .value {
        font-size: 1.1rem;
        font-weight: 600;
      }

      @media (max-width: 720px) {
        .page {
          padding: 32px 16px 64px;
        }

        header {
          padding: 32px 24px;
          min-height: 260px;
        }

        main {
          padding: 28px 24px;
        }

        .detail-card {
          flex-direction: column;
          align-items: flex-start;
        }

        .icon {
          width: 44px;
          height: 44px;
          font-size: 1.4rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <h1>AI勉強会 2024 — 未来を拓く実践知</h1>
      </header>
      <main>
        <h2>開催概要</h2>
        <div class="details">
          <article class="detail-card">
            <div class="icon">🗓</div>
            <div class="detail-content">
              <span class="label">開催日時</span>
              <span class="value">2024年7月18日（木） 18:30 - 20:30</span>
            </div>
          </article>
          <article class="detail-card">
            <div class="icon">📍</div>
            <div class="detail-content">
              <span class="label">場所</span>
              <span class="value">本社 21F イノベーションラボ</span>
            </div>
          </article>
          <article class="detail-card">
            <div class="icon">🎯</div>
            <div class="detail-content">
              <span class="label">タイトル</span>
              <span class="value">実務に活かす生成AI活用のベストプラクティス</span>
            </div>
          </article>
        </div>
      </main>
    </div>
  </body>
</html>
